"$id" = "https://codeforphilly.org/person-evaluations/v2"
"$schema" = "http://json-schema.org/draft-07/schema#"
required = ["evaluatedAt", "evaluator", "flags", "personSlug", "verdict"]
title = "Person evaluation"
type = "object"

[properties.confidence]
maximum = 1
minimum = 0
type = "number"

[properties.evaluatedAt]
format = "date-time"
pattern = '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$'
type = "string"

[properties.evaluator]
minLength = 1
type = "string"

[properties.flags]
type = "array"

[properties.flags.items]
type = "string"

[properties.personSlug]
minLength = 1
type = "string"

[properties.reasoning]
type = "string"

[properties.score]
type = "integer"

[properties.verdict]
enum = ["spam", "legit", "uncertain"]
type = "string"
