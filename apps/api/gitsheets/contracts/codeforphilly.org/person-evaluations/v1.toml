"$id" = "https://codeforphilly.org/person-evaluations/v1"
"$schema" = "http://json-schema.org/draft-07/schema#"
description = 'One spam verdict about one person from one evaluator. Machine evaluators (heuristic, LLM, github-probe) write these in the private codeforphilly-spam-detection repo; staff votes are written to codeforphilly-data by the site with evaluator = "human-<voterSlug>". Records are interchangeable at prune time.'
required = ["evaluatedAt", "evaluator", "flags", "personSlug", "verdict"]
title = "Person evaluation"
type = "object"

[properties.confidence]
description = "0-1. LLM and probe evaluators; 1 on human votes; absent on heuristic records."
maximum = 1
minimum = 0
type = "number"

[properties.evaluatedAt]
description = "ISO 8601 UTC."
format = "date-time"
type = "string"

[properties.evaluator]
description = "Model/run id (e.g. haiku-2026-05) or human-<voterSlug>."
minLength = 1
type = "string"

[properties.flags]
description = "Short reason tags."
type = "array"

[properties.flags.items]
type = "string"

[properties.personSlug]
description = "Slug of the evaluated person."
minLength = 1
type = "string"

[properties.reasoning]
description = "Free-text justification. Optional on human votes."
type = "string"

[properties.score]
description = "Heuristic evaluators only: rule points, unbounded."
type = "integer"

[properties.verdict]
enum = ["spam", "legit", "uncertain"]
type = "string"
