"$id" = "https://codeforphilly.org/spam-purges/v1"
"$schema" = "http://json-schema.org/draft-07/schema#"
required = ["beforeCommit", "blocksSignIn", "by", "evidence", "flags", "id", "personId", "personSlug", "purgedAt"]
title = "Spam purge"
type = "object"

[properties.beforeCommit]
minLength = 1
type = "string"

[properties.blocksSignIn]
type = "boolean"

[properties.by]
minLength = 1
type = "string"

[properties.evidence]
type = "array"

[properties.evidence.items]
required = ["path", "record"]
type = "object"

[properties.evidence.items.properties.field]
minLength = 1
type = "string"

[properties.evidence.items.properties.path]
minLength = 1
type = "string"

[properties.evidence.items.properties.record]
enum = ["person", "project", "project-update", "project-buzz", "help-wanted-role"]
type = "string"

[properties.flags]
type = "array"

[properties.flags.items]
type = "string"

[properties.githubUserId]
minimum = 1
type = "integer"

[properties.grantId]
format = "uuid"
pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
type = "string"

[properties.id]
format = "uuid"
pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
type = "string"

[properties.personId]
format = "uuid"
pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
type = "string"

[properties.personSlug]
minLength = 1
type = "string"

[properties.purgedAt]
format = "date-time"
pattern = '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$'
type = "string"

[properties.reason]
maxLength = 1000
minLength = 1
type = "string"

[properties.unblockReason]
maxLength = 1000
type = "string"

[properties.unblockedAt]
format = "date-time"
pattern = '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$'
type = "string"

[properties.unblockedBySlug]
minLength = 1
type = "string"
